name: CI/CD Ocaña Conecta - Docker y Despliegue

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker de Ocaña Conecta
        run: docker build -t ocana-conecta:latest .

      - name: Verificar contenedor
        run: docker images ocana-conecta:latest

  deploy-pages:
    name: Desplegar web en GitHub Pages
    needs: build-docker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar aplicación actualizada
        id: deployment
        uses: actions/deploy-pages@v4